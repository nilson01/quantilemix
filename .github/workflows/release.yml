name: Package release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Validate distributions or publish to a package index
        type: choice
        required: true
        default: check
        options: [check, testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install distribution tools
        run: python -m pip install build twine
      - name: Check publication reference and version
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version
          with open('pyproject.toml', 'rb') as source:
              version = Version(tomllib.load(source)['project']['version'])
          target = os.environ['RELEASE_TARGET']
          ref = os.environ['GITHUB_REF']
          if target not in {'check', 'testpypi', 'pypi'}:
              raise SystemExit('Unknown release target.')
          if target == 'testpypi' and ref != 'refs/heads/main':
              raise SystemExit('TestPyPI publication requires main.')
          if target == 'pypi':
              if ref != f'refs/tags/v{version}':
                  raise SystemExit('PyPI publication requires a tag matching the package version.')
              if version.is_prerelease or version.is_devrelease:
                  raise SystemExit('PyPI publication requires a final release version.')
          PY
      - name: Require passing CI before publication
        if: inputs.target != 'check'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=latest&per_page=100" > checks.json
          python - <<'PY'
          import json
          required = {'Python 3.10', 'Python 3.14', 'Minimum dependencies (Python 3.10)', 'Windows (Python 3.14)'}
          latest = {}
          for check in json.load(open('checks.json'))['check_runs']:
              if check['app']['slug'] == 'github-actions' and check['name'] in required:
                  if check['id'] > latest.get(check['name'], {}).get('id', -1):
                      latest[check['name']] = check
          failed = sorted(name for name in required if latest.get(name, {}).get('conclusion') != 'success')
          if failed:
              raise SystemExit('Required CI checks are not passing: ' + ', '.join(failed))
          PY
      - name: Build distributions and check metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Check archive contents
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile
          forbidden = {'tex', 'manual-source', 'private-author-materials', 'AGENTS.md', 'plot_examples.py', 'quantilemix-future-versions.pdf'}
          archives = sorted(Path('dist').iterdir())
          if len(archives) != 2 or sum(p.suffix == '.whl' for p in archives) != 1 or sum(p.name.endswith('.tar.gz') for p in archives) != 1:
              raise SystemExit('Expected exactly one wheel and one source archive.')
          for archive in archives:
              if archive.suffix == '.whl':
                  with zipfile.ZipFile(archive) as source:
                      names = source.namelist()
              elif archive.name.endswith('.tar.gz'):
                  with tarfile.open(archive) as source:
                      names = source.getnames()
              else:
                  raise SystemExit(f'Unexpected distribution: {archive.name}')
              for name in names:
                  parts = PurePosixPath(name).parts
                  if forbidden.intersection(parts) or name.endswith('.tex') or 'docs/manual/examples.py' in name:
                      raise SystemExit(f'Private author file in distribution: {name}')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.target != 'check'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
